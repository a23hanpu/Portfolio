<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Chempunk media placeholder</title>
  <desc id="description">A dark technical grid placeholder for Chempunk project media.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d6a72f" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#30291f"/>
      <stop offset="1" stop-color="#191b24"/>
    </linearGradient>
  </defs>
  <path fill="url(#surface)" d="M0 0h1600v900H0z"/>
  <path fill="url(#grid)" d="M0 0h1600v900H0z"/>
  <path d="M64 64h88M64 64v88m1472-88h-88m88 0v88M64 836h88m-88 0v-88m1472 88h-88m88 0v-88" fill="none" stroke="#d6a72f" stroke-opacity=".5" stroke-width="2"/>
